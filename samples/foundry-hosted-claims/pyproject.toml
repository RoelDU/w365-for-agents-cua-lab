[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zava-foundry-hosted-claims"
version = "0.1.0"
description = "Isolated Foundry hosted Claims agent using Agent 365 and Windows 365 Computer Use"
requires-python = ">=3.12"
dependencies = [
  "azure-ai-agentserver-invocations==1.2.0",
  "azure-ai-projects==2.7.0",
  "azure-identity==1.25.3",
  "microsoft-agents-a365-tooling==1.0.0",
  "microsoft-agents-a365-runtime==1.0.0",
  "microsoft-agents-authentication-msal==1.7.0",
  "mcp==2.2.0",
  "jsonschema[format]==4.26.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["mypy==2.3.1", "ruff==0.16.8", "types-jsonschema", "pytest", "pytest-asyncio", "playwright>=1.58,<2"]

[tool.setuptools.packages.find]
include = ["hosted_claims*"]

[tool.setuptools.package-data]
hosted_claims = ["*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py312"
